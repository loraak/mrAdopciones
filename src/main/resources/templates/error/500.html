<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mr. Adopciones - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/gatotriste.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body class="d-flex flex-column min-vh-100 bg-light">
    <main class="flex-grow-1 d-flex align-items-center my-5">
        <section class="container text-center">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    
                    <img th:src="@{/img/error404.jpg}" alt="Mascota perdida" class="img-fluid mb-4" style="max-height: 250px; opacity: 0.8;">

                    <h1 class="display-1 fw-bold mb-0" style="color: var(--primary-color);">500</h1>
                    
                    <h2 class="mb-4 fw-bold text-dark">¡Ups! ¿Cómo llegaste a ese error?</h2>

                    <p class="lead text-muted mb-5">
                        Parece que la página que buscas no existe, ha sido movida o el enlace estaba roto. 
                        ¡Pero no te preocupes, puedes volver! 
                    </p>

                    <a th:href="@{/}" class="btn btn-primary btn-lg rounded-pill px-5 py-3 shadow-sm fw-bold">
                        Volver al inicio
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
