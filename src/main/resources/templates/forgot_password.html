<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Adopciones - Recuperar Contraseña</title>
    <link rel="icon" type="image/png" th:href="@{/img/gatotriste.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-6 login-section">
            <div class="login-container">
                
                <div class="logo-container">
                    <img th:src="@{/img/gatotriste.png}" class="logo-img" alt="Logo Mr. Adopciones">
                    <span class="logo-text">Mr Adopciones</span>
                </div>

                <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
                <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

                <form th:action="@{/forgot-password}" method="post" class="mt-4">
                    <div class="form-floating mb-4">
                        <input type="email" name="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                        <label for="email">Introduce tu correo electrónico</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Enviar correo</button>
                </form>

                <div class="login-footer">
                    ¿Recordaste tu contraseña? <a href="/login">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 image-section2 d-none d-md-block">
        </div>
    </div>
</div>

</body>
</html>
