<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mr. Adopciones - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/gatotriste.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-6 login-section">
            <div class="login-container">
                <div class="logo-container">
                    <img th:src="@{/img/gatotriste.png}" class="logo-img" alt="Logo Mr. Adopciones">
                    <span class="logo-text">Mr Adopciones</span>
                </div>

                <div class="login-subtitle">¡Encuentra a tu compañero destinado!</div>
                <h1 class="login-title">Iniciar Sesión</h1>

                <div th:if="${param.error}" class="alert alert-danger">
                    Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
                        <label for="username">Usuario</label>
                    </div>
                    <div class="input-group mb-4">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña"  required>
                            <label for="password">Contraseña</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>

                <div class="login-footer">
                    ¿No tienes una cuenta? <a href="/register">¡Regístrate!</a>
                </div>
                <div class="login-footer">
                    ¿Olvidaste tu contraseña? <a href="/forgot-password">Recuperarla aquí</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 image-section d-none d-md-block">
        </div>
    </div>
</div>

</body>
</html>
