<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li th:each="step, iterStat : ${breadcrumb}" 
                    class="breadcrumb-item" 
                    th:classappend="${iterStat.last} ? 'active'" 
                    th:aria-current="${iterStat.last} ? 'page'">
                    
                    <a th:if="${!iterStat.last}" th:href="@{/catalog}" th:text="${step}">Catálogo</a>
                    <span th:if="${iterStat.last}" th:text="${step}">Categoría</span>
                </li>
            </ol>
        </nav>
    </div>

    <main class="flex-grow-1">
        <div class="container my-5 py-4">
            <div class="text-center mb-5">
                <h2 class="display-5 fw-bold" th:text="${title}" style="color: var(--text-dark);">Catálogo de Mascotas</h2>
                <p class="text-muted">Encuentra a tu nuevo mejor amigo entre nuestros rescatados</p>
            </div>

            <div class="container text-center mb-5">
                <div class="btn-group shadow-sm" role="group" aria-label="Filtros de mascotas">
                    <a th:href="@{/catalog}" class="btn btn-outline-pink px-4">Todos</a>
                    <a th:href="@{/catalog/perros}" class="btn btn-outline-pink px-4">Perros</a>
                    <a th:href="@{/catalog/gatos}" class="btn btn-outline-pink px-4">Gatos</a>
                    <a th:href="@{/catalog/otros}" class="btn btn-outline-pink px-4">Otros</a>
                </div>
            </div>
            
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="pet : ${pets}">
                    <div class="card h-100 shadow-sm rounded-4 border-0 pet-card">
                        <div class="position-relative overflow-hidden rounded-top-4">
                            <img th:src="${pet.imageUrl}" class="card-img-top pet-img" th:alt="${pet.name}">
                    
                        </div>
                        
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h3 class="card-title fw-bold m-0" th:text="${pet.name}" style="color: var(--text-dark);">Nombre</h3>
                                <span class="badge rounded-pill badge-pink" th:text="${pet.age + ' años'}">Edad</span>
                            </div>
                            
                            <p class="card-text text-secondary mb-4 flex-grow-1" th:text="${pet.description}">Descripción breve de la mascota...</p>
                            
                            <div class="mb-4">
                                <span th:each="tag : ${#strings.arraySplit(pet.tags, ',')}" 
                                      class="badge bg-white text-muted border fw-normal me-1 px-3 py-2 rounded-pill" 
                                      th:text="${tag}">Tag</span>
                            </div>
                            
                            <div class="d-grid mt-auto">
                                <a th:href="@{/pet/{id}(id=${pet.id})}" class="btn btn-primary rounded-pill fw-bold py-2">
                                    Conocer a <span th:text="${pet.name}"></span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
